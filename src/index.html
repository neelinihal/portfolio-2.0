<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neeli Nihal — Backend &amp; DevOps Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Neeli Nihal — Backend and DevOps Engineer. Spring Boot microservices, Kubernetes, GCP, AWS, CI/CD pipelines."
    />
    <meta name="theme-color" content="#171614" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Fraunces variable serif — Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- Satoshi — Fontshare -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
      rel="stylesheet"
    />

    <!-- Three.js (WebGL particle universe) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lenis smooth scroll -->
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>

    <!-- Lenis smooth scroll init -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (typeof Lenis === 'undefined') return;
        var lenis = new Lenis({
          duration: 1.2,
          easing: function(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); },
          smoothTouch: false,
          syncTouch: false
        });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
        window.__lenis = lenis;
      });
    </script>
  </body>
</html>
