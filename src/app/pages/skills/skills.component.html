<div class="skills" @fadeSlideIn>

  <div class="skills__header page-wrapper">
    <p class="section-label">Technical Stack</p>
    <h1 class="skills__title" appScramble>Skills</h1>
  </div>

  <div class="skills__legend page-wrapper">
    <span class="legend-item legend-item--expert">Expert</span>
    <span class="legend-item legend-item--advanced">Advanced</span>
    <span class="legend-item legend-item--proficient">Proficient</span>
  </div>

  <div class="skills__sections page-wrapper">
    @for (category of categories; track category.name; let i = $index) {
      <section
        #categoryCard
        class="skill-section"
        [attr.data-index]="i"
        [@skillCardReveal]="cardStates()[i] || 'hidden'"
      >
        <h2 class="skill-section__title">{{ category.name }}</h2>
        <div class="skill-section__chips">
          @for (skill of category.skills; track skill.name) {
            <span class="chip chip--{{ skill.level | lowercase }}">
              <img class="chip__icon" [src]="skill.iconUrl" alt="" width="14" height="14" />
              {{ skill.name }}
            </span>
          }
        </div>
      </section>
    }
  </div>

</div>
